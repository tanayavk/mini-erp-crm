name: CI Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Backend (TypeScript)
        run: |
          cd server
          npm ci
          npm run build

      - name: Build Frontend (Vite)
        run: |
          cd client
          npm ci
          npm run build